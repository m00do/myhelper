<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FDFAF2">
<title>Kadry – MyHelper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styl.css">
<style>
  body{ background:var(--paper); }

  .flat-top{ border-bottom:1.5px solid var(--line); background:var(--paper); }
  .flat-top-inner{ max-width:1300px; margin:0 auto; padding:18px 20px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .flat-top-left{ font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink); }
  .flat-top-right{ display:flex; align-items:baseline; gap:14px; color:var(--ink-soft); font-size:14px; }
  .flat-top-right button{ background:none; border:none; color:var(--ink-soft); font-size:14px; font-family:inherit; cursor:pointer; text-decoration:underline; padding:0; }
  .flat-top-right button:hover{ color:var(--clay); }

  .content{ max-width:1300px; margin:0 auto; padding:22px 20px 60px; }

  .selector-row{ display:flex; justify-content:flex-end; margin-bottom:18px; }
  .selector-row label{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink-soft); }
  .selector-row select{ font-family:var(--font-body); font-size:14.5px; padding:8px 12px; border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); min-width:180px; }

  .board-row{ display:flex; gap:22px; align-items:flex-start; }
  .scroll-wrap{ flex:1; min-width:0; display:flex; align-items:stretch; gap:8px; }
  .arrow-btn{ flex-shrink:0; width:38px; align-self:center; height:38px; border-radius:50%; border:1.5px solid var(--blue); background:#fff; color:var(--blue-dark); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .arrow-btn:hover{ background:var(--blue); color:#fff; }
  .arrow-btn:disabled{ opacity:.3; cursor:default; background:#fff; color:var(--blue-dark); }

  .dzial-track{ flex:1; min-width:0; display:flex; gap:16px; overflow-x:auto; scroll-behavior:smooth; padding:20px 4px; border:1.5px solid var(--line); border-radius:24px; background:#fff; }
  .dzial-col{ flex:0 0 240px; display:flex; flex-direction:column; gap:10px; }
  .dzial-col h3{ font-family:var(--font-display); font-size:15px; margin:0 0 2px; text-align:center; }

  .dyzur-card{ border:1.5px solid var(--ink); border-radius:14px; padding:12px 14px; background:#fff; }
  .dyzur-card .d-godziny{ font-weight:700; font-size:13.5px; margin-bottom:4px; font-family:var(--font-mono); }
  .dyzur-card .d-info{ font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .dyzur-card.trwa{ background:linear-gradient(135deg, var(--blue), var(--blue-dark)); border-color:var(--blue-dark); color:#fff; }
  .dyzur-card.trwa .d-info{ color:rgba(255,255,255,0.85); }

  .aktualnie-panel{ width:250px; flex-shrink:0; }
  .aktualnie-panel h3{ font-family:var(--font-display); font-size:16px; margin:0 0 10px; }
  .aktualnie-box{ border:1.5px solid var(--line); border-radius:18px; padding:14px; background:#fff; min-height:160px; display:flex; flex-direction:column; gap:10px; }
  .aktualnie-item{ border-bottom:1px dashed var(--line); padding-bottom:8px; }
  .aktualnie-item:last-child{ border-bottom:none; padding-bottom:0; }
  .aktualnie-item .a-nazwa{ font-weight:700; font-size:13px; color:var(--blue-dark); }
  .aktualnie-item .a-info{ font-size:11.5px; color:var(--ink-soft); }

  @media(max-width:820px){
    .board-row{ flex-direction:column; }
    .aktualnie-panel{ width:100%; }
  }
</style>
</head>
<body>
  <header class="flat-top">
    <div class="flat-top-inner">
      <div class="flat-top-left" id="tytul">nazwa konwentu - Kadry</div>
      <div class="flat-top-right">
        <span id="kontoLogin"></span>
        <button id="btnWyloguj" type="button">wyloguj</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="selector-row">
      <label>wybierz dzień:
        <select id="wyborDnia"></select>
      </label>
    </div>

    <div class="board-row">
      <div class="scroll-wrap">
        <button class="arrow-btn" id="strzalkaLewo" type="button">‹</button>
        <div class="dzial-track" id="dzialTrack"></div>
        <button class="arrow-btn" id="strzalkaPrawo" type="button">›</button>
      </div>
      <div class="aktualnie-panel">
        <h3>aktualnie:</h3>
        <div class="aktualnie-box" id="aktualnieBox"></div>
      </div>
    </div>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

<script src="/assets/klient.js"></script>
<script>
(function(){
  const sesja = MyHelper.wymagajZalogowania(['kadry']);
  if (!sesja) return;

  document.getElementById('tytul').textContent = sesja.nazwaKonwentu + ' - Kadry';
  document.getElementById('kontoLogin').textContent = sesja.login;
  document.getElementById('btnWyloguj').addEventListener('click', MyHelper.wyloguj);

  const wyborDnia = document.getElementById('wyborDnia');
  const dzialTrack = document.getElementById('dzialTrack');
  const aktualnieBox = document.getElementById('aktualnieBox');

  function dzisiejszaData(){
    const t = new Date();
    return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  }

  function pokazBrakDanych(){
    dzialTrack.innerHTML = '<div class="stan-pusty" style="margin:auto;"><div class="ikona">🗓️</div><h3>Brak wgranych danych</h3><p>Administrator nie wgrał jeszcze pliku grafiku.</p></div>';
    aktualnieBox.innerHTML = '<p class="empty-hint" style="margin:0;">—</p>';
  }

  async function wczytajDni(){
    let dni;
    try { dni = await MyHelper.wywolajApi('/api/kadry/dni'); }
    catch (err) { pokazBrakDanych(); return null; }
    if (!dni || dni.length === 0) { pokazBrakDanych(); return null; }
    wyborDnia.innerHTML = dni.map(d => `<option value="${d}">${d}</option>`).join('');
    wyborDnia.value = dni.includes(dzisiejszaData()) ? dzisiejszaData() : dni[0];
    return wyborDnia.value;
  }

  async function renderTablica(){
    const data = wyborDnia.value;
    if (!data) return;
    let tablica;
    try { tablica = await MyHelper.wywolajApi('/api/kadry/tablica/' + encodeURIComponent(data)); }
    catch (err) { MyHelper.toast(err.message, 'error'); return; }

    dzialTrack.innerHTML = '';
    tablica.forEach(kol => {
      const col = document.createElement('div');
      col.className = 'dzial-col';
      col.innerHTML = `<h3 style="color:${kol.kolor || 'var(--ink)'}">${MyHelper.esc(kol.dzial)}</h3>` + (kol.dyzury || []).map(d => `
        <div class="dyzur-card ${d.trwaTeraz ? 'trwa' : ''}">
          <div class="d-godziny">${MyHelper.esc(d.start)}-${MyHelper.esc(d.koniec)}</div>
          <div class="d-info">${(d.wolontariusze || []).map(w => MyHelper.esc(w.nazwa)).join(', ') || 'brak przypisanych osób'}</div>
        </div>
      `).join('') || '<p class="empty-hint">Brak dyżurów tego dnia.</p>';
      dzialTrack.appendChild(col);
    });
  }

  async function renderAktualnie(){
    try {
      const obecne = await MyHelper.wywolajApi('/api/kadry/obecne');
      aktualnieBox.innerHTML = obecne.length === 0
        ? '<p class="empty-hint" style="margin:0;">Nic nie trwa teraz.</p>'
        : obecne.map(o => `
          <div class="aktualnie-item">
            <div class="a-nazwa" style="color:${o.kolor || 'var(--blue-dark)'}">${MyHelper.esc(o.dzial)}</div>
            <div class="a-info">${MyHelper.esc(o.start)}-${MyHelper.esc(o.koniec)} · ${(o.wolontariusze||[]).map(w=>MyHelper.esc(w.nazwa)).join(', ') || 'brak osób'}</div>
          </div>
        `).join('');
    } catch (err) {
      aktualnieBox.innerHTML = '<p class="empty-hint" style="margin:0;">—</p>';
    }
  }

  wyborDnia.addEventListener('change', renderTablica);

  document.getElementById('strzalkaLewo').addEventListener('click', () => dzialTrack.scrollBy({ left: -260, behavior: 'smooth' }));
  document.getElementById('strzalkaPrawo').addEventListener('click', () => dzialTrack.scrollBy({ left: 260, behavior: 'smooth' }));

  (async function start(){
    const wybrany = await wczytajDni();
    if (!wybrany) return;
    await renderTablica();
    await renderAktualnie();
    setInterval(() => { renderTablica(); renderAktualnie(); }, 30000);
  })();
})();
</script>
</body>
</html>
